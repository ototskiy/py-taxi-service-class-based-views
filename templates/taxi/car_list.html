{% extends "base.html" %}
{% block content %}
  <h1>Car list</h1>
  {% if car_list %}
    <table class="table table-striped">
        <tr>
          <th>id</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      {% for car in car_list %}
        <tr>
          <th><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></th>
          <th>{{ car.model }}</th>
          <th>{{ car.manufacturer.name }}</th>
        </tr>
      {% endfor %}
    </table>
  {%  else %}
    <p>There are no car in database!</p>
  {% endif %}
{% endblock %}
